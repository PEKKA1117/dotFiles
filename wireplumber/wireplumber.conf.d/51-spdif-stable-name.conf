# 固定內建 S/PDIF sink 的名字。
# wireplumber 交出音效卡後不會釋放舊的 node 名字，sink 重建時會多一個 .N 後綴，
# 選好的 default 比對不到新名字就失效。規則在加完後綴之後才套用，所以一律改回固定名字。
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.pci-0000_00_1f.3.iec958-stereo.*" }
    ]
    actions = {
      update-props = {
        node.name = "DF-C20"
      }
    }
  }
]
