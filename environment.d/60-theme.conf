# Tokyo Night 主題所需的環境變數。
#
# 這份檔案只餵給 systemd --user 管理的程序(含 foot-server、dbus 啟動的應用)。
# 直接由 sway exec 啟動的程序繼承的是 sway 自己的環境,那部分要在
# /usr/local/bin/start-sway 裡 export,見 README / CLAUDE.md。

# Qt6 走 qt6ct(調色盤 = qt6ct/colors/TokyoNight.conf,樣式 = Kvantum)
QT_QPA_PLATFORMTHEME=qt6ct

# Qt5 這台機器沒裝 qt5ct,直接讓 Kvantum 接手;
# 顏色來自 Kvantum/KvTokyoNight 的 [GeneralColors]。
QT_STYLE_OVERRIDE=kvantum-dark
