# LVRA Wiki NVIDIA 修正 — 由 vr-nvidia-tune.sh 產生
[Service]
# 繞過 NVIDIA 驅動的 compositor 排程 bug:不加這兩個,轉頭會有明顯延遲。
# 等同 Envision Preferences 裡的「Nvidia mitigation」開關。
Environment=XRT_COMPOSITOR_USE_PRESENT_WAIT=1
Environment=U_PACING_COMP_TIME_FRACTION_PERCENT=90

# Wayland session 下 vkAcquireXlibDisplayEXT 回傳 VK_ERROR_UNKNOWN 的解法
Environment=XRT_COMPOSITOR_FORCE_WAYLAND_DIRECT=1

# timewarp 餘裕。預設 4ms,GPU 吃到 100% 時會來不及而造成頓挫/暈。
# 先用 8;若仍會頓就往上加(低階 GPU 可能要兩位數)。
Environment=U_PACING_COMP_MIN_TIME_MS=8
