# 允許 PipeWire 跟著曲目切換採樣率,避免 44.1k 內容被重採樣成 48k。
#
# 這條鏈路是 ALC897 光纖 S/PDIF → Audio Pro C20。
# 實測(2026-09-14)可原生鎖定的採樣率:44.1 / 48 / 88.2 / 96 / 192 kHz。
#
# 刻意不列 176400:HDA 驅動對 176.4k 不會報錯,而是直接吸附成 192000,
# 造成音高偏移。排除後,176.4k 的內容會由上層重採樣(建議降到 88.2k,整數除 2)。
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 ]
}
