#!/hint/bash
# shellcheck disable=2034
#
# /home/df/.config/pacman/makepkg.conf
# 使用者層覆寫 —— makepkg 在 /etc/makepkg.conf 與 /etc/makepkg.conf.d/*.conf
# 之後才 source 此檔,所以這裡設的值優先權最高(見 /usr/share/makepkg/util/config.sh)
#
# 讓編譯平行度自動跟隨 CPU 親和性:
# nproc 回傳的是「當前行程可用的核心數」而非實體核心數,會受 sched_getaffinity 限制。
# 透過 ecore(taskset 到 E-core)啟動時這裡自動變成 -j8,
# 直接跑 makepkg 時則是 -j20 —— 不必寫死任何數字,換 CPU 也不用改。

MAKEFLAGS="-j$(nproc)"
NINJAFLAGS="-j$(nproc)"
